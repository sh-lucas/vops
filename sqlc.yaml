version: "2"
sql:
  - engine: "sqlite"
    queries:
      - "internal/store/queries.sql"
    schema: "internal/store/migrations/"
    gen:
      go:
        package: "queries"
        out: "internal/store/queries"
        sql_package: "database/sql"
        emit_empty_slices: true
        emit_json_tags: true
